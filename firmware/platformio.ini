; -----------------------------------------------------------------------------
; Edge-AI Predictive Maintenance Node -- Raspberry Pi Pico W
;
; Build:    py -m platformio run
; Monitor:  py -m platformio device monitor
; Simulate: F1 -> "Wokwi: Start Simulator" (reads wokwi.toml next to this file)
; -----------------------------------------------------------------------------

[env:rpipicow]
; maxgerhardt's fork tracks Earle Philhower's arduino-pico core, which is the
; one with real Pico W support (CYW43439 WiFi, correct GP23-25/29 handling).
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.16.1

build_flags =
    -O2
    ; Wokwi's MPU6050 reports whatever constant the sliders are dragged to --
    ; it emits no waveform. This flag swaps the accelerometer front end for a
    ; synthesiser driven by that slider as a severity knob. Everything
    ; downstream (PCA, FFT, features, forest) is untouched. Set to 0 for real
    ; hardware. See vibration_source.h for the full rationale.
    -DVIB_SOURCE_WOKWI_SIM=1
    ; Uncomment to verify on boot that the exported forest reproduces the
    ; Python model's predictions on captured feature vectors.
    ; -DENABLE_SELFTEST
    ; Cloud telemetry. Needs knolleary/PubSubClient in lib_deps plus WIFI_SSID,
    ; WIFI_PASSWORD, MQTT_BROKER and MQTT_PORT defines. Off for the Wokwi demo.
    ; -DENABLE_MQTT

; -----------------------------------------------------------------------------
; Real-hardware variant: live MPU6050 stream, no synthesis shim.
;   py -m platformio run -e rpipicow_hardware
; -----------------------------------------------------------------------------
[env:rpipicow_hardware]
extends = env:rpipicow
build_flags =
    -O2
    -DVIB_SOURCE_WOKWI_SIM=0
